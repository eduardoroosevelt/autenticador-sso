server:
  port: 9000

spring:
  datasource:
    url: jdbc:h2:mem:sso;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:db/schema.sql
  session:
    store-type: redis
  data:
    redis:
      host: localhost
      port: 6379
  thymeleaf:
    cache: false

logging:
  level:
    org.springframework.security: INFO

app:
  issuer-uri: http://localhost:9000
